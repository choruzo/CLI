[workspace]
resolver = "2"
members = ["crates/dot-link", "src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["Javier (choruzo)"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[profile.release]
# El instalador tiene que pesar poco (PRD M6: < 15 MB).
opt-level = "s"
lto = true
codegen-units = 1
strip = true
