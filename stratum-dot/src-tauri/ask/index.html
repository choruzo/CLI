<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dot-ask" content="{{NONCE}}" />
    <title>Ask your assistant — Stratum Dot</title>
    <link rel="stylesheet" href="unlock.css" />
    <link rel="stylesheet" href="ask.css" />
    <script src="ask.js" defer></script>
  </head>
  <body class="ask" data-voice="idle">
    <main>
      <header>
        <span class="brand"><span class="dot" aria-hidden="true"></span>Stratum <span class="muted">· your assistant</span></span>
        <span id="waiting" class="waiting" hidden></span>
      </header>
      <form id="ask" autocomplete="off" novalidate>
        <div class="field">
          <span class="mic" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
              <path d="M12 17.5V21" />
            </svg>
          </span>
          <label for="text" class="visually-hidden">Ask your assistant</label>
          <textarea
            id="text"
            name="text"
            rows="2"
            maxlength="{{MAX_CHARS}}"
            placeholder="Ask your assistant…"
            spellcheck="true"
            aria-describedby="voice status hint"
          ></textarea>
        </div>
      </form>
      <footer>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="voice" class="voice" role="status" aria-live="polite" hidden>
          <span id="voice-label" class="voice-label"></span>
          <span class="voice-bar" aria-hidden="true"><span id="voice-level"></span></span>
        </p>
        <p id="hint" class="hint">
          <span><kbd>Enter</kbd> send</span>
          <span><kbd>Shift</kbd><kbd>Enter</kbd> new line</span>
          <span><kbd>Esc</kbd> close</span>
          <span class="talk"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>D</kbd> hold to talk</span>
        </p>
      </footer>
    </main>
  </body>
</html>
