[package]
name = "stratum-dot"
description = "Stratum Dot — cockpit nativo de stratumd: cliente del Stratum Protocol"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# El sufijo `_lib` evita el choque de nombres entre el binario y la librería en Windows.
name = "stratum_dot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dot-link = { path = "../crates/dot-link" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# El nonce de la ventana de desbloqueo, del generador del sistema operativo.
getrandom = "0.3"
# Una sola instancia por usuario: abrir Dot otra vez enfoca la que ya hay.
tauri-plugin-single-instance = "2"
# Posición y tamaño de la ventana entre arranques (preferencia de interfaz).
tauri-plugin-window-state = "2"
# M16: la notificación del sistema al terminar una rutina. Solo la usa el lado
# nativo (`notify.rs`); el webview no recibe su permiso.
tauri-plugin-notification = "2"
# El Dot compacto (PRD §8.2) se abre con un atajo global. Solo lo usa el lado
# nativo (`ask.rs`): el webview no recibe su permiso.
tauri-plugin-global-shortcut = "2"

# En Windows el aviso se muestra con la misma crate que usa el plugin por debajo,
# para engancharse a su evento `Activated`: el plugin no avisa del clic en el
# escritorio y, sin activador COM, Windows no relanza la app al pulsarlo.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
