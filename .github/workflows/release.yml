name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'

permissions:
  contents: write
  id-token: write   # necesario para la provenance de npm

jobs:
  release:
    name: Build, test & publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stratum-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Error: el tag '$TAG' no coincide con la versión en package.json ('$PKG_VERSION')"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Pack
        run: |
          TARBALL=$(npm pack --ignore-scripts --silent | tail -n 1)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Publish to npm
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
            npm publish "$TARBALL" --provenance --access public --tag beta
          else
            npm publish "$TARBALL" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease \
              "$TARBALL"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "$TARBALL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
