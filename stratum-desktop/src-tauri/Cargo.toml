[package]
name = "stratum-desktop"
version = "0.3.0"
description = "Stratum Desktop — shell Tauri v2 sobre el core de stratum-cli"
authors = ["Javier (choruzo)"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# El sufijo `_lib` evita el choque de nombres entre el binario y la librería en
# Windows (recomendación de la plantilla de Tauri v2).
name = "stratum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# D7: auto-update contra GitHub Releases (lo usa solo Rust, `updates.rs`).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# D7: solo para la suite E2E (tauri-driver). Los diálogos nativos de abrir y
# guardar no se pueden manejar por WebDriver: con esta feature, y solo si la
# suite define STRATUM_E2E_PICK / STRATUM_E2E_SAVE_DIR, se sustituyen por esas
# rutas. Nunca entra en un build de release.
e2e = []

[dev-dependencies]
tempfile = "3"
