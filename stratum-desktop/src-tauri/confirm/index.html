<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="desktop-confirm" content="{{NONCE}}" />
    <title>Confirmar — Stratum Desktop</title>
    <link rel="stylesheet" href="confirm.css" />
    <script src="confirm.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">Confirmar</h1>
      <p id="lead" class="muted small">
        Stratum Desktop te pide confirmarlo aquí, fuera de su ventana principal. Lo que ves lo ha leído del daemon de
        Stratum.
      </p>
      <dl id="facts" class="facts"></dl>
      <section id="answers" class="block" hidden>
        <h2>Respuestas que vas a enviar</h2>
        <dl id="answer-list" class="facts"></dl>
      </section>
      <section id="plan" class="block" hidden>
        <h2>Plan</h2>
        <p id="plan-summary"></p>
        <ol id="plan-steps"></ol>
      </section>
      <ul id="notes" class="notes"></ul>
      <form id="confirm" autocomplete="off" novalidate>
        <div id="phrase-box" hidden>
          <label for="phrase">Para aprobar, escribe <code id="phrase-text"></code></label>
          <input id="phrase" name="phrase" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button type="button" id="cancel" autofocus>Cancelar</button>
          <button type="button" id="ok" class="primary" disabled>Confirmar</button>
        </div>
      </form>
      <p id="expiry" class="small muted"></p>
    </main>
  </body>
</html>
